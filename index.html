<style>
  html, body { margin: 0; height: 100%; background: #0a0518; overflow: hidden; overscroll-behavior: none; }
  body { display: flex; align-items: center; justify-content: center; height: 100dvh; }
  canvas { max-width: 100vw; max-height: 100vh; max-height: 100dvh; aspect-ratio: 16/9; image-rendering: auto; outline: none;
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  /* on-screen controls: coarse pointers only, pinned to the letterbox bands */
  #touch { display: none; position: fixed; inset: 0; pointer-events: none; font: bold 22px monospace; }
  #touch button { pointer-events: auto; position: absolute; bottom: max(18px, env(safe-area-inset-bottom)); width: 68px; height: 68px;
    border-radius: 50%; border: 2px solid rgba(150,220,255,0.65); color: #eaf6ff; font: inherit;
    background: radial-gradient(circle at 32% 28%, rgba(140,120,230,0.55), rgba(42,21,80,0.55) 62%, rgba(20,10,44,0.6));
    box-shadow: 0 0 14px rgba(110,90,220,0.45), inset 0 1px 0 rgba(255,255,255,0.28), inset 0 -6px 12px rgba(10,5,26,0.5);
    text-shadow: 0 0 6px rgba(150,220,255,0.9);
    touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  #touch button:active { border-color: rgba(255,235,160,0.9);
    background: radial-gradient(circle at 32% 28%, rgba(190,160,255,0.75), rgba(90,55,160,0.7) 62%, rgba(30,15,66,0.75));
    box-shadow: 0 0 22px rgba(160,130,255,0.8), inset 0 1px 0 rgba(255,255,255,0.35); }
  #tc-blow { border-color: rgba(255,190,120,0.7); text-shadow: 0 0 6px rgba(255,200,120,0.9);
    box-shadow: 0 0 14px rgba(240,140,60,0.4), inset 0 1px 0 rgba(255,255,255,0.28), inset 0 -6px 12px rgba(10,5,26,0.5); }
  #tc-left  { left: max(16px, env(safe-area-inset-left)); }
  #tc-right { left: calc(max(16px, env(safe-area-inset-left)) + 86px); }
  #tc-jump  { right: calc(max(16px, env(safe-area-inset-right)) + 86px); }
  #tc-blow  { right: max(16px, env(safe-area-inset-right)); }
  @media (pointer: coarse) { #touch { display: block; } }
</style>
</head>
<body>
<canvas id="cv" width="1280" height="720"></canvas>
<div id="touch">
  <button id="tc-left" data-key="ArrowLeft" aria-label="run left">&#9664;</button>
  <button id="tc-right" data-key="ArrowRight" aria-label="run right">&#9654;</button>
  <button id="tc-jump" data-key="ArrowUp" aria-label="jump">&#9650;</button>
  <button id="tc-blow" data-key=" " aria-label="blow bubble">&#9679;</button>
</div>
<script src="game.js"></script>
</body>
